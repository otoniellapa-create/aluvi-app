<script>
/* ===================================================================
   ALUVI — Login individual (camada de autenticação Supabase Auth)
   Bloqueia o app até haver uma sessão válida. Contas são criadas só
   pelo administrador (cadastro público desativado no painel).
   =================================================================== */
(function () {
  var SUPA_URL = "https://ztfpeabfhuwdtdpvftft.supabase.co";
  var SUPA_KEY = "sb_publishable_skyJRqJCQverL_eDYGUZvg_0KvPp4hC";
  var LS = "aluvi_sessao";
  var session = null;
  var overlay = null;

  function salvar(s) {
    session = s;
    try { s ? localStorage.setItem(LS, JSON.stringify(s)) : localStorage.removeItem(LS); } catch (e) {}
  }
  function carregar() {
    try { var r = localStorage.getItem(LS); if (r) session = JSON.parse(r); } catch (e) {}
  }
  function valido() {
    return !!(session && session.access_token && session.expires_at &&
      (session.expires_at * 1000 - Date.now() > 60000));
  }
  function normaliza(d, emailFallback) {
    return {
      access_token: d.access_token,
      refresh_token: d.refresh_token,
      expires_at: d.expires_at || (Math.floor(Date.now() / 1000) + (d.expires_in || 3600)),
      email: (d.user && d.user.email) || emailFallback
    };
  }
  async function login(email, senha) {
    var r = await fetch(SUPA_URL + "/auth/v1/token?grant_type=password", {
      method: "POST",
      headers: { apikey: SUPA_KEY, "Content-Type": "application/json" },
      body: JSON.stringify({ email: email, password: senha })
    });
    var d = await r.json().catch(function () { return {}; });
    if (!r.ok) throw new Error(d.error_description || d.msg || d.error || ("Falha no login (" + r.status + ")"));
    salvar(normaliza(d, email));
    return true;
  }
  async function refresh() {
    if (!session || !session.refresh_token) return false;
    try {
      var r = await fetch(SUPA_URL + "/auth/v1/token?grant_type=refresh_token", {
        method: "POST",
        headers: { apikey: SUPA_KEY, "Content-Type": "application/json" },
        body: JSON.stringify({ refresh_token: session.refresh_token })
      });
      if (!r.ok) { salvar(null); return false; }
      var d = await r.json();
      salvar(normaliza(d, session.email));
      return true;
    } catch (e) { return false; }
  }
  function mostrar() { if (overlay) overlay.style.display = "flex"; }
  function esconder() { if (overlay) overlay.style.display = "none"; }
  function logout() { salvar(null); mostrar(); }

  window.__aluviAuth = {
    getToken: function () { return session ? session.access_token : null; },
    autenticado: function () { return !!(session && session.access_token); },
    email: function () { return session ? session.email : null; },
    logout: logout
  };

  function construirOverlay() {
    overlay = document.createElement("div");
    overlay.id = "aluvi-login";
    overlay.style.cssText = "position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;background:#0A1D31;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding:24px";
    overlay.innerHTML =
      '<div style="width:100%;max-width:360px;text-align:center">' +
        '<div style="font-family:Georgia,serif;letter-spacing:4px;font-size:34px;color:#F5F1E6">ALUVI</div>' +
        '<div style="color:#C9A227;letter-spacing:3px;font-size:12px;margin-bottom:28px">GEST&Atilde;O INTELIGENTE</div>' +
        '<div style="color:#F5F1E6;font-size:15px;margin-bottom:18px">Entre com sua conta para continuar</div>' +
        '<input id="aluvi-email" type="email" autocomplete="username" placeholder="seu e-mail" style="width:100%;box-sizing:border-box;padding:13px 14px;margin-bottom:10px;border-radius:10px;border:1px solid #24425f;background:#0d243b;color:#F5F1E6;font-size:15px">' +
        '<input id="aluvi-senha" type="password" autocomplete="current-password" placeholder="sua senha" style="width:100%;box-sizing:border-box;padding:13px 14px;margin-bottom:14px;border-radius:10px;border:1px solid #24425f;background:#0d243b;color:#F5F1E6;font-size:15px">' +
        '<button id="aluvi-entrar" style="width:100%;padding:14px;border:none;border-radius:10px;background:#C9A227;color:#0A1D31;font-weight:700;font-size:15px;cursor:pointer">Entrar</button>' +
        '<div id="aluvi-erro" style="color:#ff8a80;font-size:13px;margin-top:12px;min-height:18px"></div>' +
        '<div style="color:#6f8aa5;font-size:12px;margin-top:18px;line-height:1.5">Acesso apenas para contas autorizadas pelo administrador.<br>Esqueceu a senha? Fale com o administrador.</div>' +
      '</div>';
    document.body.appendChild(overlay);
    var email = overlay.querySelector("#aluvi-email");
    var senha = overlay.querySelector("#aluvi-senha");
    var btn = overlay.querySelector("#aluvi-entrar");
    var erro = overlay.querySelector("#aluvi-erro");
    async function tentar() {
      erro.textContent = "";
      if (!email.value || !senha.value) { erro.textContent = "Preencha e-mail e senha."; return; }
      btn.disabled = true; btn.textContent = "Entrando…";
      try { await login(email.value.trim(), senha.value); senha.value = ""; esconder(); }
      catch (e) { erro.textContent = e.message || "Não foi possível entrar."; }
      finally { btn.disabled = false; btn.textContent = "Entrar"; }
    }
    btn.addEventListener("click", tentar);
    senha.addEventListener("keydown", function (ev) { if (ev.key === "Enter") tentar(); });
    email.addEventListener("keydown", function (ev) { if (ev.key === "Enter") senha.focus(); });
  }

  setInterval(function () {
    if (session && session.expires_at && (session.expires_at * 1000 - Date.now() < 120000)) refresh();
  }, 60000);

  async function iniciar() {
    carregar();
    construirOverlay();
    if (valido()) { esconder(); return; }
    if (session && session.refresh_token) {
      if (navigator.onLine === false) { esconder(); return; } /* offline: mantém sessão local já existente */
      if (await refresh()) { esconder(); return; }
    }
    mostrar();
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", iniciar);
  else iniciar();
})();
</script>

const agoraHM = () => {

const fmtData = iso => {
  if (!iso) return "—";

const num = v => {
  if (v === "" || v === null || v === undefined) return null;

/* ===== Semáforo dos parâmetros =====
   A faixa configurada (min/max) é o VERDE. Fora dela, mas antes do limite crítico,
   é AMARELO (observar). Passando do crítico, é VERMELHO (agir e corrigir o manejo).
   Cada parâmetro traz a ação sugerida. São SUGESTÕES técnicas — a decisão de manejo
   é do produtor. Revise os limites com seu engenheiro. */
const FAIXAS_CRIT = {

const AVISO_SUGESTAO = "Sugestão automática com base nos parâmetros. Não é prescrição — a decisão de manejo é de responsabilidade do produtor. Na dúvida, fale com um profissional habilitado.";

/* ===== Rede de proteção contra erro de digitação =====
   Não julga manejo — só pega o que é fisicamente improvável (pH 14, oxigênio 0,
   temperatura 300). Esses números alimentam a sugestão de ração e a biometria:
   um dígito errado envenena a inteligência inteira. Fora daqui o app pede confirmação. */
const LIMITES_PLAUSIVEL = {
  tempSup: [0, 45, "Temperatura (superfície)", "°C"],
  tempMeio: [0, 45, "Temperatura (meio)", "°C"],
  tempFundo: [0, 45, "Temperatura (fundo)", "°C"],
  ph: [3, 12, "pH", ""],
  od: [0.1, 20, "Oxigênio dissolvido", "mg/L"],
  amonia: [0, 50, "Amônia total", "mg/L"],
  nitrito: [0, 50, "Nitrito", "mg/L"],
  alcalinidade: [0, 1000, "Alcalinidade", "mg/L"],
  salinidade: [0, 50, "Salinidade", "ppt"],
  nitrato: [0, 1000, "Nitrato", "mg/L"],
  dureza: [0, 1000, "Dureza", "mg/L CaCO₃"],
  solidos: [0, 200, "Sólidos sedim.", "mL/L"]
};
function valoresSuspeitos(v) {
  const out = [];
  Object.keys(LIMITES_PLAUSIVEL).forEach(k => {
    const bruto = v[k];
    if (bruto === null || bruto === undefined || bruto === "" || isNaN(Number(bruto))) return;
    const [mn, mx, label, un] = LIMITES_PLAUSIVEL[k];
    const n = Number(bruto);
    if (n < mn || n > mx) out.push(`• ${label}: ${n}${un ? " " + un : ""} — esperado entre ${mn} e ${mx}`);
  });
  return out;
}

/* ===== Autoria automática =====
   Quem lançou vem do USUÁRIO LOGADO (não de um nome digitado) e a hora é a do
   momento do lançamento. Isso cria trilha confiável: ninguém lança no nome de
   outra pessoa. Registros antigos seguem mostrando o campo antigo (resp). */
function autoria() {
  const email = window.__aluviAuth && window.__aluviAuth.email ? window.__aluviAuth.email() : null;
  return {
    porEmail: email || null,
    porQuando: new Date().toISOString()
  };
}
const autorDe = r => r && (r.porEmail || r.resp) || "";

    day: "2-digit",

};

/* ===== Arraçoamento inteligente · ajuste pela temperatura da água =====
   A tabela por peso dá a taxa base (água em faixa ideal). A temperatura muda o
   metabolismo da tilápia: no frio ela come menos — ração sobrando é desperdício

const fatorTemp = tC => tC === null || tC === undefined || isNaN(tC) ? null : FATOR_TEMP.find(f => tC < f.ate) || FATOR_TEMP[FATOR_TEMP.length - 1];
/* ===== Curva de crescimento de referência — tilápia =====
   Semana -> peso médio esperado (tabela SUGESTÃO ALIMENTAR, Guabi/Pirá).
   Uso: ancora na gramatura de recepção do lote e lê o "peso ideal de hoje".
   É referência de peixe saudável em boas condições — serve pra COMPARAR, não pra obedecer. */
const CURVA_TILAPIA = [[1, 0.5], [2, 1.1], [3, 2.2], [4, 4], [5, 6.5], [6, 10], [7, 15], [8, 22.2], [9, 32], [10, 44.6], [11, 60.3], [12, 78.9], [13, 99.2], [14, 121.9], [15, 148.2], [16, 179.7], [17, 219], [18, 265.4], [19, 316.1], [20, 370.4], [21, 428.1], [22, 489.4], [23, 554.1], [24, 620.6], [25, 688.9], [26, 758.9], [27, 828.9], [28, 898.9], [29, 967.1], [30, 1033.6], [31, 1100.1], [32, 1164.8], [33, 1227.8], [34, 1290.8], [35, 1352.1], [36, 1411.6], [37, 1469.3], [38, 1525.3], [39, 1579.6], [40, 1632.1], [41, 1684.6], [42, 1735.3], [43, 1784.3], [44, 1833.3], [45, 1882.3], [46, 1931.3], [47, 1980.3]];
/* peso -> semana equivalente na curva (interpolado) */
function semanaParaPeso(pesoG) {
  if (pesoG === null || pesoG === undefined || isNaN(pesoG) || pesoG <= 0) return null;
  const c = CURVA_TILAPIA;
  if (pesoG <= c[0][1]) return c[0][0];
  for (let i = 1; i < c.length; i++) {
    if (pesoG <= c[i][1]) return c[i - 1][0] + (pesoG - c[i - 1][1]) / (c[i][1] - c[i - 1][1]) * (c[i][0] - c[i - 1][0]);
  }
  return c[c.length - 1][0];
}
/* semana -> peso esperado (interpolado) */
function pesoParaSemana(sem) {
  if (sem === null || sem === undefined || isNaN(sem)) return null;
  const c = CURVA_TILAPIA;
  if (sem <= c[0][0]) return c[0][1];
  for (let i = 1; i < c.length; i++) {
    if (sem <= c[i][0]) return c[i - 1][1] + (sem - c[i - 1][0]) / (c[i][0] - c[i - 1][0]) * (c[i][1] - c[i - 1][1]);
  }
  return c[c.length - 1][1];
}
/* peso ideal de hoje: entra na curva pela gramatura de recepção e avança os dias decorridos */
function pesoIdealHoje(pesoInicialG, dias) {
  const entrada = semanaParaPeso(pesoInicialG);
  if (entrada === null || dias === null || dias === undefined || isNaN(dias) || dias < 0) return null;
  return pesoParaSemana(entrada + dias / 7);
}

/* temperatura média da leitura mais recente do tanque — só vale se for de hoje/ontem */
function tempAtualTanque(s, tanqueId) {
  const p = s.parametros.filter(x => x.tanqueId === tanqueId).sort((a, b) => b.ts - a.ts)[0];
  if (!p) return null;
  const vs = [p.tempSup, p.tempMeio, p.tempFundo].filter(v => v !== null && v !== undefined && !isNaN(v));
  if (!vs.length) return null;
  const dias = p.dataISO ? diasEntre(p.dataISO, hojeISO()) : 99;
  if (dias > 2) return null;
  return {
    media: vs.reduce((a, b) => a + b, 0) / vs.length,
    dataISO: p.dataISO,
    dias
  };
}

const permDe = usuario => {
  if (!usuario) return {
    lanca: true,
    edita: true,
    admin: true,
    parametros: true,
    manejos: true,
    estoque: true
  };
  const base = PAPEIS[usuario.cargo] || PAPEIS["Operador"];
  const mods = MODULOS_POR_CARGO[usuario.cargo] || MODULOS_POR_CARGO["Operador"];
  /* marcador individual (quando definido) manda mais que o padrão do cargo.
     Aceita booleano ou o texto "Sim"/"Não" vindo do formulário. Vazio = segue o cargo. */
  const escolhe = (v, padrao) => {
    if (v === undefined || v === null || v === "") return padrao;
    if (typeof v === "string") return v.trim().toLowerCase().charAt(0) === "s";
    return !!v;
  };
  return {
    ...base,
    parametros: escolhe(usuario.podeParametros, mods.parametros),
    manejos: escolhe(usuario.podeManejos, mods.manejos),
    estoque: escolhe(usuario.podeEstoque, mods.estoque)
  };
};

/* link de WhatsApp com mensagem pronta */
const waLink = (fone, texto) => {
  const d = String(fone || "").replace(/\D/g, "");
  const num = d.length >= 12 ? d : d.length >= 10 ? "55" + d : null;
  return num ? `https://wa.me/${num}?text=${encodeURIComponent(texto)}` : null;
};

/* estoque derivado dos movimentos (fonte da verdade = movsEstoque) */
function recalcEstoque(d) {
  const saldo = {};
  (d.movsEstoque || []).forEach(m => {
    if (!m.itemId) return;
    saldo[m.itemId] = (saldo[m.itemId] || 0) + (m.tipo === "entrada" ? m.qtd || 0 : -(m.qtd || 0));
  });
  (d.estoque || []).forEach(it => {
    it.qtd = Math.max(0, Math.round((saldo[it.id] || 0) * 1000) / 1000);
  });
}
/* exclusão com lápide (para sincronização): registra o id e filtra */
function delReg(d, colecao, id) {
  if (!d.deletados) d.deletados = [];
  if (!d.deletados.includes(id)) d.deletados.push(id);
  d[colecao] = (d[colecao] || []).filter(x => x.id !== id);
}

/* migração leve: garante chaves novas em stores antigos */
function migrar(d) {
  const base = SEED();
  Object.keys(base).forEach(k => {
    if (d[k] === undefined) d[k] = base[k];
  });
  if (!d.config) d.config = base.config;
  if (!d.config.faixas) d.config.faixas = FAIXAS_DEFAULT;
  if (!d.config.responsaveis) d.config.responsaveis = ["Oto", "João"];
  if (d.config.metaFCA === undefined) d.config.metaFCA = 1.8;
  if (d.config.sistema === undefined) d.config.sistema = "Bioflocos (BFT)";
  if (d.config.estrutura === undefined) d.config.estrutura = "Suspenso em geomembrana";
  if (d.config.especiePrincipal === undefined) d.config.especiePrincipal = "Tilápia GIFT";
  if (!d.config.energia) d.config.energia = {
    tipoRede: "",
    precoKwh: null
  };
  ["nitrato", "dureza", "solidos"].forEach(k => {
    if (!d.config.faixas[k]) d.config.faixas[k] = FAIXAS_DEFAULT[k];
  });
  if (!d.usuarios) d.usuarios = [];
  if (!d.recados) d.recados = [];
  if (!d.recadosLidos) d.recadosLidos = [];
  if (!d.patrocinios) d.patrocinios = [];
  if (d.usuarios.length === 0 && d.config.responsaveis?.length) d.usuarios = d.config.responsaveis.map((n, i) => ({
    id: uid(),
    nome: n,
    cargo: i === 0 ? "Administrador master" : "Operador",
    pin: ""
  }));
  /* quem já tem lançamentos não passa pelo wizard de novo */
  if (d.config.onboarded === undefined) d.config.onboarded = (d.lotes?.length || 0) + (d.parametros?.length || 0) + (d.arracoamentos?.length || 0) + (d.movsEstoque?.length || 0) > 0;
  if (!d.deletados) d.deletados = [];
  /* estoque passa a ser derivado dos movimentos: gera mov de saldo p/ diferenças legadas */
  (d.estoque || []).forEach(it => {
    const derivado = (d.movsEstoque || []).reduce((t, m) => m.itemId === it.id ? t + (m.tipo === "entrada" ? m.qtd || 0 : -(m.qtd || 0)) : t, 0);
    const dif = Math.round(((it.qtd || 0) - derivado) * 1000) / 1000;
    const refId = "saldo-migracao-" + it.id;
    if (Math.abs(dif) > 0.0005 && !(d.movsEstoque || []).some(m => m.refId === refId)) {
      d.movsEstoque.push({
        id: uid(),
        um: Date.now(),
        refId,
        itemId: it.id,
        dataISO: hojeISO(),
        ts: Date.now(),
        tipo: dif > 0 ? "entrada" : "saida",
        qtd: Math.abs(dif),
        origem: "Saldo inicial (migração)"
      });
    }
  });
  recalcEstoque(d);
  return d;
}

function analisarFazenda(s) {
  const itens = alertasGerais(s).map(a => ({
    nivel: a.nivel,
    titulo: a.txt,
    detalhe: a.det,
    modulo: a.modulo,
    acao: null
  }));
  const F = s.config.faixas;
  /* tendências de amônia/nitrito por tanque (3 últimas medições crescentes chegando perto do limite) */
  s.tanques.filter(t => t.ativo).forEach(t => {
    const ps = s.parametros.filter(p => p.tanqueId === t.id).sort((a, b) => a.ts - b.ts).slice(-3);
    if (ps.length === 3) {
      ["amonia", "nitrito"].forEach(k => {
        const v = ps.map(p => p[k]).filter(x => x != null);
        if (v.length === 3 && v[0] < v[1] && v[1] < v[2] && F[k].max && v[2] >= F[k].max * 0.7 && v[2] <= F[k].max) {
          itens.push({
            nivel: "warn",
            modulo: "params",
            titulo: `${t.id}: ${F[k].label} em tendência de alta`,
            detalhe: `${fmtNum(v[0])} → ${fmtNum(v[1])} → ${fmtNum(v[2])} ${F[k].unit} (limite ${F[k].max})`,
            acao: "Ainda dentro da faixa, mas subindo. Aumente a frequência de medição e avise seu engenheiro antes de estourar o limite."
          });
        }
      });
    }
  });
  lotesAtivos(s).forEach(l => {
    const k = calcLote(s, l);
    const t = tanqueDe(s, l.tanqueId);
    /* estocagem acima da capacidade cadastrada */
    if (t?.capacidadeAlevinos && l.nInicial > t.capacidadeAlevinos) itens.push({
      nivel: "warn",
      modulo: "tanques",
      titulo: `${l.tanqueId}: estocagem acima da capacidade cadastrada`,
      detalhe: `${fmtInt(l.nInicial)} povoados · capacidade ${fmtInt(t.capacidadeAlevinos)}`,
      acao: "Confirme com seu engenheiro se a densidade está adequada ao sistema e à aeração disponível."
    });
    /* mortalidade recorrente: 3+ dias distintos com morte nos últimos 5 dias */
    const dias5 = new Set(s.mortalidades.filter(m => m.loteId === l.id && diasEntre(m.dataISO, hojeISO()) <= 5).map(m => m.dataISO));
    if (dias5.size >= 3) itens.push({
      nivel: "crit",
      modulo: "mort",
      titulo: `${l.tanqueId}: mortalidade recorrente`,
      detalhe: `Mortes em ${dias5.size} dos últimos 5 dias`,
      acao: "Padrão repetido não é acaso: reveja os parâmetros de água, reduza estresse de manejo e acione o engenheiro/sanitarista."
    });
    /* FCA vs meta */
    if (k.fca && k.fca > (s.config.metaFCA || 1.8)) itens.push({
      nivel: "warn",
      modulo: "fin",
      titulo: `${l.tanqueId}: FCA ${fmtNum(k.fca, 2)} acima da meta (${fmtNum(s.config.metaFCA || 1.8, 1)})`,
      detalhe: `Cada 0,1 de FCA a mais é ração paga sem virar peixe`,
      acao: "Revise taxa de arraçoamento, uniformidade do lote (biometria) e sobras. Ajuste a meta em Config se seu engenheiro orientar outra referência."
    });
  });
  /* garantia de equipamentos + projeção de despesca */
  s.equipamentos.forEach(eq => {

const DB_NAME = "aluvi-v2",

const idb = {

    try {

      rq.onupgradeneeded = () => rq.result.createObjectStore(KVS);
      rq.onsuccess = () => res(rq.result);
      rq.onerror = () => rej(rq.error);
    } catch (e) {
      rej(e);
    }
  }),
  get: async () => {
    const db = await idb.open();
    return new Promise((res, rej) => {
      const rq = db.transaction(KVS).objectStore(KVS).get(KEY);
      rq.onsuccess = () => res(rq.result);
      rq.onerror = () => rej(rq.error);
    });
  },
  set: async v => {
    const db = await idb.open();
    return new Promise((res, rej) => {
      const tx = db.transaction(KVS, "readwrite");
      tx.objectStore(KVS).put(v, KEY);
      tx.oncomplete = res;
      tx.onerror = () => rej(tx.error);
    });
  }

  try {
    const v = await idb.get();
    if (v) return {
      data: v,
      engine: "idb"

  } catch (e) {}
  try {
    const raw = localStorage.getItem(DB_NAME);
    if (raw) return {
      data: JSON.parse(raw),
      engine: "ls"
    };
  } catch (e) {}
  try {
    const v0 = SEED();
    await idb.set(v0);
    return {
      data: v0,
      engine: "idb"
    };
  } catch (e) {}
  const v0 = SEED();
  try {
    localStorage.setItem(DB_NAME, JSON.stringify(v0));
    return {
      data: v0,
      engine: "ls"
    };
  } catch (e) {}

    data: v0,
    engine: "mem"

let saveTimer = null;
function persist(store, engine) {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    if (engine === "idb") {
      try {
        await idb.set(store);
        return;
      } catch (e) {}
    }

    dias,
    densidade,
    racaoDiaKg,

    ultimaBio,
    bios,
    diasSemBio,
    racaoKg,
    ganhoKg,
    taxa,
    taxaBase,
    tempAgua,
